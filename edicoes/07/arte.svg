<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="brilho" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5ff" stop-opacity=".9"/><stop offset="1" stop-color="#002a4a"/></linearGradient>
    <linearGradient id="terra" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a3414"/><stop offset="1" stop-color="#2a1404"/></linearGradient>
    <radialGradient id="boom" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffd400"/><stop offset=".7" stop-color="#ff6a00" stop-opacity=".8"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
    <!-- calango de capacete: corpo verde, capacete na cor da equipe (currentColor) -->
    <symbol id="calango" viewBox="-60 -50 120 80">
      <path d="M-50 10Q-58 4-54-4Q-46 6-34 8" fill="none" stroke="#7dff3a" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="-10" cy="10" rx="30" ry="14" fill="#7dff3a" stroke="#0a2a04" stroke-width="3"/>
      <path d="M-26 20l-8 10M-2 22l-4 10M8 20l8 9" stroke="#0a2a04" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="24" cy="-2" rx="20" ry="15" fill="#7dff3a" stroke="#0a2a04" stroke-width="3"/>
      <circle cx="30" cy="-6" r="6" fill="#fff" stroke="#0a2a04" stroke-width="2"/><circle cx="32" cy="-6" r="3" fill="#000"/>
      <path d="M34 6q6 2 10-2" stroke="#0a2a04" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M6-10a18 15 0 0 1 34-2Z" fill="currentColor" stroke="#000" stroke-width="3"/>
      <rect x="4" y="-12" width="38" height="5" rx="2" fill="#fff" opacity=".85"/>
    </symbol>
  </defs>
  <!-- estrelas e lua -->
  <g fill="#fff"><circle cx="40" cy="250" r="1.5"/><circle cx="120" cy="330" r="1"/><circle cx="560" cy="120" r="1.6"/><circle cx="470" cy="60" r="1"/><circle cx="360" cy="100" r="1.3"/><circle cx="250" cy="250" r="1"/><circle cx="580" cy="300" r="1.2"/><circle cx="200" cy="40" r="1"/></g>
  <circle cx="500" cy="230" r="44" fill="#fff3c0" opacity=".9"/>
  <!-- explosão e terra voando -->
  <circle cx="420" cy="410" r="120" fill="url(#boom)" filter="url(#brilho)"/>
  <circle cx="420" cy="410" r="60" fill="url(#boom)"/>
  <g fill="#5a3414" stroke="#7dff3a" stroke-width="2"><path d="M330 330l14-6 6 12-12 6Z"/><path d="M500 320l12 4-4 12-12-4Z"/><path d="M470 300l8-8 8 8-8 8Z"/><path d="M360 300l10 2-2 10-10-2Z"/></g>
  <!-- trajetória pontilhada e manga explosiva -->
  <path d="M150 520Q230 300 360 330" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="4 12" stroke-linecap="round" opacity=".8"/>
  <g transform="translate(372 334) rotate(30)" filter="url(#glow)"><ellipse rx="22" ry="16" fill="#ffb000" stroke="#000" stroke-width="3"/><path d="M-4-16q2-10 12-12" stroke="#22c55e" stroke-width="4" fill="none"/><path d="M-12-4a10 8 0 0 1 10-6" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/></g>
  <!-- ilha principal -->
  <path d="M-20 600Q30 520 110 540T250 520Q330 500 380 560T520 560Q580 540 620 590V700H-20Z" fill="url(#terra)" stroke="#7dff3a" stroke-width="5" filter="url(#glow)"/>
  <!-- cratera -->
  <path d="M360 548Q420 640 486 560" fill="#06102a" stroke="#ff8a00" stroke-width="4"/>
  <!-- coqueiro -->
  <g transform="translate(60 550)"><path d="M0 0Q-6-80 14-150" stroke="#8a5a2b" stroke-width="10" fill="none"/><g fill="#22c55e"><path d="M14-150Q-40-170-70-130Q-30-155 14-148Z"/><path d="M14-150Q70-180 100-140Q60-160 14-148Z"/><path d="M14-150Q-10-200-50-205Q-5-185 14-152Z"/><path d="M14-150Q50-205 90-200Q45-185 14-152Z"/></g></g>
  <!-- calangos -->
  <use href="#calango" x="110" y="440" width="150" height="100" color="#ff2bd6" filter="url(#glow)"/>
  <!-- bazuca de bambu no ombro -->
  <g transform="translate(200 478) rotate(-38)"><rect x="0" y="-8" width="80" height="16" rx="5" fill="#c9a24a" stroke="#000" stroke-width="3"/><path d="M26-8v16M52-8v16" stroke="#7a5a1a" stroke-width="3"/></g>
  <use href="#calango" x="478" y="505" width="110" height="74" color="#00e5ff" transform="rotate(-25 533 542) scale(-1 1) translate(-1066 0)"/>
  <g fill="#fff" font-family="Arial Black, sans-serif" font-size="26" font-weight="900" stroke="#000" stroke-width="5" paint-order="stroke"><text x="140" y="430">100</text><text x="490" y="490" fill="#ff3b5c">-47</text></g>
  <!-- mar neon -->
  <path d="M0 690Q50 676 100 690T200 690T300 690T400 690T500 690T600 690V800H0Z" fill="url(#mar)" opacity=".85"/>
  <path d="M0 690Q50 676 100 690T200 690T300 690T400 690T500 690T600 690" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
</svg>
