<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="brasa" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <radialGradient id="nebulosa" cx="60%" cy="35%" r="60%"><stop offset="0" stop-color="#ff2bd6" stop-opacity=".45"/><stop offset=".5" stop-color="#7b3bff" stop-opacity=".25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="lua" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#e8eeff"/><stop offset=".55" stop-color="#9ad0ff"/><stop offset="1" stop-color="#1b2350"/></radialGradient>
    <linearGradient id="cauda" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd400" stop-opacity="0"/><stop offset=".7" stop-color="#ff8a00" stop-opacity=".7"/><stop offset="1" stop-color="#fff3a0"/></linearGradient>
    <symbol id="pedra" viewBox="-50 -50 100 100"><path d="M-12-46L22-40 44-14 40 18 18 44-16 42-42 20-46-12-30-36Z" fill="#14081f" stroke="#ff8a00" stroke-width="5" stroke-linejoin="round"/><path d="M-10-20L8-26 20-6 6 10-14 4Z" fill="none" stroke="#ff8a00" stroke-width="3" opacity=".55"/></symbol>
  </defs>
  <rect width="600" height="800" fill="url(#nebulosa)"/>
  <g fill="#fff"><circle cx="40" cy="250" r="1.5"/><circle cx="130" cy="320" r="1"/><circle cx="560" cy="130" r="1.6"/><circle cx="470" cy="50" r="1"/><circle cx="350" cy="96" r="1.3"/><circle cx="240" cy="260" r="1"/><circle cx="585" cy="320" r="1.2"/><circle cx="60" cy="540" r="1.4"/><circle cx="210" cy="470" r="1"/><circle cx="550" cy="540" r="1.3"/><circle cx="410" cy="70" r="1"/><circle cx="280" cy="360" r="1.5"/><circle cx="20" cy="420" r="1"/><circle cx="500" cy="420" r="1"/><circle cx="160" cy="620" r="1.2"/></g>
  <!-- lua no canto -->
  <circle cx="560" cy="250" r="120" fill="url(#lua)" opacity=".85"/>
  <g fill="#1b2350" opacity=".45"><circle cx="520" cy="215" r="16"/><circle cx="575" cy="290" r="22"/><circle cx="505" cy="300" r="10"/></g>
  <!-- meteoro em chamas -->
  <path d="M40 40L330 330 300 360Z" fill="url(#cauda)" filter="url(#brasa)" opacity=".9"/>
  <path d="M80 60L330 320 312 338Z" fill="url(#cauda)" opacity=".8"/>
  <g filter="url(#glow)">
    <use href="#pedra" x="250" y="250" width="160" height="160"/>
    <use href="#pedra" x="430" y="420" width="110" height="110" transform="rotate(25 485 475)"/>
    <use href="#pedra" x="60" y="440" width="80" height="80" transform="rotate(-40 100 480)"/>
    <use href="#pedra" x="380" y="610" width="50" height="50"/>
    <use href="#pedra" x="160" y="360" width="40" height="40"/>
  </g>
  <!-- nave vetorial e tiros -->
  <g transform="translate(250 560) rotate(-28)" filter="url(#glow)">
    <path d="M0-46L28 30 0 16-28 30Z" fill="#05020f" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-12 24L0 58 12 24" fill="none" stroke="#ff8a00" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g fill="#ffd400" filter="url(#glow)"><circle cx="276" cy="482" r="6"/><circle cx="292" cy="448" r="6"/><circle cx="308" cy="414" r="6"/></g>
  <!-- estilhaços -->
  <g stroke="#ff8a00" stroke-width="4" stroke-linecap="round" filter="url(#glow)"><path d="M330 380l18 6M310 400l-6 18M352 350l14-10"/></g>
</svg>
